# =============================================================================
# Skelenote Sync Relay - Docker Compose
# =============================================================================
# Quick start for self-hosted sync relay.
#
# Usage:
#   docker-compose up -d        # Start in background
#   docker-compose logs -f      # View logs
#   docker-compose down         # Stop
# =============================================================================

services:
  sync-relay:
    build: .
    image: skelenote-sync-relay:latest
    container_name: skelenote-sync-relay
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # Persist SQLite databases outside the container
      - ./data:/data
    environment:
      # Server port (default: 8787)
      - PORT=8787
      # Data directory for SQLite files (default: /data)
      - DATA_DIR=/data
      # Idle room cleanup timeout in milliseconds (default: 5 minutes)
      - ROOM_IDLE_TIMEOUT=300000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
