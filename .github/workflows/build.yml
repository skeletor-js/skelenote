name: Build

on:
  workflow_dispatch:  # Manual trigger only - use release.yml for actual releases

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin -- --profile ci'
            name: macOS-ARM
          - platform: ubuntu-22.04
            target: ''
            args: '-- --profile ci'
            name: Linux
          - platform: windows-latest
            target: ''
            args: '--bundles nsis -- --profile ci'
            name: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache apt packages (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm mold
          version: 1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          prefix-key: 'v1-ci'

      - name: Configure mold linker (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p .cargo
          echo '[target.x86_64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "clang"' >> .cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]' >> .cargo/config.toml

      - name: Install and configure LLD linker (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install llvm -y
          New-Item -ItemType Directory -Force -Path .cargo | Out-Null
          @"
          [target.x86_64-pc-windows-msvc]
          linker = "lld-link"
          "@ | Out-File -FilePath .cargo/config.toml -Encoding utf8

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: skelenote-${{ matrix.name }}
          path: |
            src-tauri/target/*/ci/bundle/dmg/*.dmg
            src-tauri/target/*/ci/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: skelenote-${{ matrix.name }}
          path: |
            src-tauri/target/ci/bundle/deb/*.deb
            src-tauri/target/ci/bundle/rpm/*.rpm
            src-tauri/target/ci/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: skelenote-${{ matrix.name }}
          path: src-tauri/target/ci/bundle/nsis/*.exe
          if-no-files-found: error
