name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin -- --profile ci'
            name: macOS-ARM
          - platform: ubuntu-22.04
            target: ''
            args: '-- --profile ci'
            name: Linux
          - platform: windows-latest
            target: ''
            args: '--bundles nsis -- --profile ci'
            name: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache apt packages (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm mold
          version: 1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          # Test if sccache is working before enabling it
          if sccache --start-server 2>/dev/null && sccache -s >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "::notice::sccache enabled successfully"
          else
            echo "::warning::sccache failed to start, proceeding without cache"
            # Stop any partial sccache state
            sccache --stop-server 2>/dev/null || true
          fi

      - name: Configure mold linker (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p .cargo
          echo '[target.x86_64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "clang"' >> .cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]' >> .cargo/config.toml

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.args }}

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then
            sccache --show-stats || echo "sccache stats unavailable"
          else
            echo "sccache was not enabled for this build"
          fi

      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: skelenote-${{ matrix.name }}
          path: |
            src-tauri/target/*/ci/bundle/dmg/*.dmg
            src-tauri/target/*/ci/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: skelenote-${{ matrix.name }}
          path: |
            src-tauri/target/ci/bundle/deb/*.deb
            src-tauri/target/ci/bundle/rpm/*.rpm
            src-tauri/target/ci/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: skelenote-${{ matrix.name }}
          path: src-tauri/target/ci/bundle/nsis/*.exe
          if-no-files-found: error
