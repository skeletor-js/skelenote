name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'I have read the CLA and agree to its terms' || github.event_name == 'pull_request_target')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: '.github/CLA.md'
          branch: 'main'
          allowlist: 'bot*,dependabot*'
          custom-notsigned-prcomment: |
            Thanks for your contribution! Before we can merge this PR, you need to sign our Contributor License Agreement.

            Please read the [CLA](.github/CLA.md) and comment below:

            > I have read the CLA and agree to its terms
          custom-pr-sign-comment: 'I have read the CLA and agree to its terms'
