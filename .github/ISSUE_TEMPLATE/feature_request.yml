name: Feature Request
description: Suggest a new feature or improvement for Skelenote
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Skelenote! We'd love to hear your ideas.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area of the app does this relate to?
      options:
        - Objects & Types (Tasks, Notes, Projects, etc.)
        - Editor & Content
        - Search & Navigation
        - Sync (Campfire or Cloud)
        - Templates
        - Daily Notes
        - Keyboard Shortcuts
        - Import/Export
        - Settings & Preferences
        - Security & Encryption
        - Performance
        - UI/UX Design
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      description: This helps us prioritize
      options:
        - Nice to have - Would make things better
        - Important - Significantly improves my workflow
        - Critical - Blocking my use of Skelenote
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Need
      description: What problem does this solve? What are you trying to accomplish?
      placeholder: "I'm trying to... but currently I can't because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you envision this working?
      placeholder: "It would be great if I could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried any workarounds? Are there other ways this could be solved?
      placeholder: "I've tried... but it doesn't quite work because..."
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples or References
      description: Have you seen this done well in other apps? Screenshots, links, or descriptions welcome.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and this hasn't been requested
          required: true
