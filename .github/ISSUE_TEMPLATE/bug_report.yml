name: Bug Report
description: Report a bug or unexpected behavior in Skelenote
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us understand and reproduce the issue.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you using?
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Linux (Other)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      description: "Find this in Settings > About (e.g., 0.1.0-alpha.1)"
      placeholder: "0.1.0-alpha.1"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical - App crashes or data loss
        - High - Feature completely broken
        - Medium - Feature partially works
        - Low - Minor annoyance or cosmetic issue
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? Be as specific as possible.
      placeholder: "When I click X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open the app
        2. Navigate to...
        3. Click on...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "I expected the object to be saved..."
    validations:
      required: true

  - type: dropdown
    id: skeleton-key
    attributes:
      label: Skeleton Key Status
      description: Have you set up your Skeleton Key?
      options:
        - "Yes, set up and working"
        - "Yes, but having issues with it"
        - "No, haven't set it up yet"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: sync
    attributes:
      label: Sync Status
      description: Are you using any sync features?
      options:
        - Not using sync
        - Using Campfire (local P2P sync)
        - Using Cloud Relay
        - Using both Campfire and Cloud
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: |
        Add screenshots if applicable. For logs:
        - macOS: `~/Library/Logs/com.skelenote.app/`
        - Windows: `%APPDATA%\com.skelenote.app\logs\`
        - Linux: `~/.local/share/com.skelenote.app/logs/`
      placeholder: "Drag and drop images here, or paste log excerpts..."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem? (vault size, specific object types, etc.)
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I checked the [Known Issues](https://github.com/skeletor-js/skelenote/blob/main/docs/user/alpha/KNOWN_ISSUES.md) and this isn't listed
          required: true
        - label: I searched existing issues and this hasn't been reported
          required: true
